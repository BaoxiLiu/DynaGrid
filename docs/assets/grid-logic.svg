<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">DynaGrid：让买入距离适应市场</title><desc id="desc">固定网格等距排列，动态网格在波动或库存上升时扩大买入间距；每次买入独立配对止盈。图为机制示意，并非收益展示或同时挂单数量。</desc>
<rect width="1000" height="510" rx="16" fill="#f5f8fc"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="42" fill="#2366b5" font-size="12" letter-spacing="2">DYNAGRID / STRATEGY NOTES</text>
<text x="40" y="83" fill="#172e43" font-size="29" font-weight="600">让买入距离适应市场</text>
<text x="40" y="111" fill="#64798d" font-size="15">波动与库存控制接货距离，止盈目标独立计算。</text>
<rect x="40" y="140" width="448" height="220" rx="8" fill="white" stroke="#dae3ed"/>
<rect x="512" y="140" width="448" height="220" rx="8" fill="white" stroke="#dae3ed"/>
