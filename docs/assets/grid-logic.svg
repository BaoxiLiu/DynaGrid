<text x="534" y="171" fill="#172e43" font-size="17" font-weight="600">动态间距</text>
<text x="62" y="193" fill="#64798d" font-size="12">价格变化，预设间距保持不变</text>
<text x="534" y="193" fill="#64798d" font-size="12">低波动较密 · 波动或库存升高时变疏</text>
